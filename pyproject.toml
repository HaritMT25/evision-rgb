[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evision-rgb"
version = "0.7.2"
description = "Open-source RGB control for EVision-based keyboards (AJAZZ AK820 and other USB 320F devices) and AJAZZ AKP macro pads: per-key lighting, layered live effects, music sync, shareable profiles, desktop app, HTTP API and MCP server"
readme = "README.md"
license = "MIT"
authors = [{ name = "Harit Tarwani" }]
keywords = ["rgb", "keyboard", "ajazz", "ak820", "evision", "hid", "openrgb", "mcp", "macro pad", "stream dock", "akp03", "akp153"]
requires-python = ">=3.10"
dependencies = ["hidapi", "numpy", "psutil"]

[project.optional-dependencies]
effects = ["pynput", "soundcard", "pycaw; sys_platform == 'win32'"]
mcp = ["mcp"]
pads = ["pillow"]
media = ["pillow", "winrt-runtime; sys_platform == 'win32'", "winrt-Windows.Foundation; sys_platform == 'win32'",
         "winrt-Windows.Foundation.Collections; sys_platform == 'win32'",
         "winrt-Windows.Media.Control; sys_platform == 'win32'", "winrt-Windows.Storage.Streams; sys_platform == 'win32'"]
gui = ["pywebview", "pystray", "pillow", "evision-rgb[media]"]
emulation = ["numba", "pefile"]  # exact preview of the built-in effects (runs the keyboard's own firmware code)
app = ["evision-rgb[gui,effects,pads,media,emulation]"]  # everything the desktop app bundles
dev = ["pyinstaller"]

[project.scripts]
evrgb = "evision_rgb.cli:main"
evision-rgb = "evision_rgb.gui.app:main"

[tool.setuptools]
packages = ["evision_rgb", "evision_rgb.gui"]

[tool.setuptools.package-data]
"evision_rgb.gui" = ["web/*", "web/assets/*", "icon.ico"]

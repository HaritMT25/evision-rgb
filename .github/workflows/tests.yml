name: tests
on: [push, pull_request]
concurrency:  # a newer push supersedes a run still going (it checks everything again)
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false  # one failing job must not hide the others' results
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "${{ matrix.python }}" }
      - name: Install
        run: python -m pip install -e ".[mcp,pads,media]"
      - name: Behaviour + unit tests (firmware simulator, no keyboard needed)
        working-directory: tests
        run: python -m unittest -v
      - name: Mutation check (the suite must catch known past bugs; once per OS)
        if: matrix.python == '3.13'
        run: python scripts/mutation_check.py

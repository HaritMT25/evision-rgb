name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "${{ matrix.python }}" }
      - name: Install
        run: python -m pip install -e ".[mcp]"
      - name: Behaviour + unit tests (firmware simulator, no keyboard needed)
        working-directory: tests
        run: python -m unittest -v
      - name: Mutation check (the suite must catch known past bugs)
        run: python scripts/mutation_check.py

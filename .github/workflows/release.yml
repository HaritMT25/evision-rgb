name: release
# Builds the Windows app on every version tag (v0.4.0, ...) and publishes it as a GitHub release.
# Run it by hand (Actions > release > Run workflow) to get the zip as a build artifact without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows-app:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }  # build_exe.sh dates the bundled firmware engine by its last commit
      - uses: actions/setup-python@v6
        with: { python-version: "3.14" }
      - name: Install (pinned to the versions the app is tested with)
        shell: bash
        run: |
          python -m venv .venv
          .venv/Scripts/python -m pip install --upgrade pip
          .venv/Scripts/python -m pip install -c scripts/app-constraints.txt -e ".[app,dev,mcp]"
      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(.venv/Scripts/python -c "import evision_rgb; print(evision_rgb.__version__)")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but the package says $v"; exit 1; }
      - name: Behaviour + unit tests
        working-directory: tests
        run: ..\.venv\Scripts\python -m unittest
      - name: Build the exe
        shell: bash
        run: sh scripts/build_exe.sh
      - name: The built app checks itself (no keyboard or pad needed)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\EVision RGB\EVision RGB.exe" -ArgumentList "--selftest", "$PWD\selftest.json" -Wait -PassThru
          Get-Content selftest.json
          if ($p.ExitCode -ne 0) { throw "self-test failed ($($p.ExitCode))" }
      - name: Package
        shell: pwsh
        run: |
          $v = (.venv\Scripts\python -c "import evision_rgb; print(evision_rgb.__version__)").Trim()
          .venv\Scripts\python scripts\third_party_notices.py "dist\EVision RGB\THIRD-PARTY-NOTICES.txt" --build "build\pyi\EVision RGB" --dist "dist\EVision RGB"
          Copy-Item LICENSE, README.md, CHANGELOG.md "dist\EVision RGB\"
          $zip = "EVision-RGB-$v-windows-x64.zip"
          Compress-Archive -Path "dist\EVision RGB" -DestinationPath $zip
          "$((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower())  $zip" | Out-File -Encoding ascii "$zip.sha256"
          "ZIP=$zip" >> $env:GITHUB_ENV
          "VERSION=$v" >> $env:GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: EVision-RGB-windows-x64
          path: EVision-RGB-*.zip*
      - name: Publish the release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .venv/Scripts/python scripts/release_notes.py "$VERSION" > notes.md
          gh release create "$GITHUB_REF_NAME" "$ZIP" "$ZIP.sha256" --title "EVision RGB $VERSION" --notes-file notes.md
